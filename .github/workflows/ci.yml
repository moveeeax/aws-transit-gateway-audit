name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Audit the example payload
        run: |
          set +e
          aws-transit-gateway-audit --from-json examples/hub-and-spoke.json --fail-on critical
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1 on the broken example, got $code"; exit 1; }
      - name: Clean payload exits zero
        run: aws-transit-gateway-audit --from-json examples/clean.json --fail-on warn
