[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-transit-gateway-audit"
version = "0.1.0"
description = "Audit AWS Transit Gateway wiring, routing and attachment health from describe output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "transit-gateway", "networking", "audit", "finops", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = ["boto3>=1.28", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
aws-transit-gateway-audit = "aws_transit_gateway_audit.cli:run"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-transit-gateway-audit"
Issues = "https://github.com/moveeeax/aws-transit-gateway-audit/issues"

[tool.setuptools.packages.find]
include = ["aws_transit_gateway_audit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
